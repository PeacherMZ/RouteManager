name: Test, package and draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - run: rustup default 1.99.0
      - name: Identify Cargo cache workspace
        id: cargo-cache-context
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const workspace = createHash('sha256').update(process.env.GITHUB_WORKSPACE).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `workspace=${workspace}\n`);
          NODE
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/cargo
          # Tauri build output contains absolute permission paths; never restore across workspaces.
          key: rust-v2-${{ matrix.platform }}-1.99.0-${{ steps.cargo-cache-context.outputs.workspace }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/macos/helper.m', 'src-tauri/build.rs') }}
          restore-keys: rust-v2-${{ matrix.platform }}-1.99.0-${{ steps.cargo-cache-context.outputs.workspace }}-
      - run: pnpm install --frozen-lockfile
      - name: Cache Windows packaging tools and offline runtime
        if: runner.os == 'Windows'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-windows-x64-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install test browsers
        run: pnpm exec playwright install chromium webkit
      - name: Browser tests (synthetic data only)
        run: pnpm exec playwright test
      - name: Build Windows installer and run backend contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Build macOS PKG and run backend contracts
        if: runner.os == 'macOS'
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.platform }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: installer-*
          path: artifacts/release
          merge-multiple: true
      - name: Validate complete artifacts and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
